<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>实时时钟 · 指针与数字</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 1rem;
        }

        .clock-wrapper {
            background: radial-gradient(circle at 30% 30%, #2d3b4f, #1a2332);
            padding: 2rem 2rem 2.5rem;
            border-radius: 4rem 4rem 4.5rem 4.5rem;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7),
                inset 0 -4px 8px rgba(0, 0, 0, 0.6),
                inset 0 4px 8px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .clock-face {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #f8fafc, #dce2ec);
            box-shadow: 
                inset 0 0 30px rgba(0, 0, 0, 0.25),
                0 10px 25px rgba(0, 0, 0, 0.5),
                0 0 0 12px #2d3b4f,
                0 0 0 14px rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.2s;
        }

        /* 刻度 & 数字 —— 使用伪类+旋转 */
        .mark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .mark > span {
            position: absolute;
            display: block;
            left: 50%;
            transform-origin: 0 50%;
            font-weight: 600;
            color: #1e293b;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
        }

        /* 刻度线 (小时/分钟) 用伪元素实现，减少dom */
        .mark-line {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform-origin: 50% 50%;
        }

        .mark-line::before {
            content: '';
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 16px;
            background: #1e293b;
            border-radius: 2px;
            box-shadow: 0 0 1px rgba(255, 255, 255, 0.3);
        }

        /* 整点加粗加长 */
        .mark-line.hour::before {
            height: 22px;
            width: 4px;
            top: 12px;
            background: #0f172a;
        }

        /* 数字定位 (12个) */
        .num {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            transform-origin: 50% 50%;
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.4);
        }

        .num > span {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            line-height: 1;
        }

        /* 中心小圆点 */
        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            background: #1e293b;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 
                0 0 0 5px rgba(220, 230, 240, 0.6),
                inset 0 2px 6px rgba(0, 0, 0, 0.5);
            z-index: 10;
            border: 2px solid #e2e8f0;
        }

        /* 指针容器 — 所有指针共用中心点 */
        .hands {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            border-radius: 12px;
            background: #1e293b;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.05s cubic-bezier(0.4, 2.5, 0.3, 1);
        }

        .hand-hour {
            width: 7px;
            height: 80px;
            margin-left: -3.5px;
            background: #1e293b;
            border-radius: 8px;
            z-index: 3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .hand-minute {
            width: 5px;
            height: 110px;
            margin-left: -2.5px;
            background: #2d3b4f;
            z-index: 4;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .hand-second {
            width: 2.5px;
            height: 118px;
            margin-left: -1.25px;
            background: #b91c1c;
            z-index: 5;
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(185, 28, 28, 0.5);
            transition: transform 0.05s linear;
        }

        /* 秒针尾部装饰 */
        .hand-second::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #b91c1c;
            border-radius: 50%;
            opacity: 0.7;
        }

        /* 数字时间显示 (优雅小屏) */
        .digital-time {
            margin-top: 28px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .digital-time span {
            font-size: 2.2rem;
            font-weight: 500;
            color: #eef2f6;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            background: transparent;
            padding: 0 4px;
        }

        .digital-time .seconds {
            font-size: 1.6rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .digital-time .date {
            display: block;
            font-size: 0.9rem;
            font-weight: 300;
            color: #aab7c9;
            letter-spacing: 1px;
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 6px;
        }

        /* 响应式调整 */
        @media (max-width: 460px) {
            .clock-face {
                width: 260px;
                height: 260px;
            }
            .clock-wrapper {
                padding: 1.5rem 1.5rem 2rem;
                border-radius: 3rem 3rem 3.5rem 3.5rem;
            }
            .hand-hour {
                height: 64px;
                width: 6px;
                margin-left: -3px;
            }
            .hand-minute {
                height: 90px;
                width: 4px;
                margin-left: -2px;
            }
            .hand-second {
                height: 96px;
                width: 2px;
                margin-left: -1px;
            }
            .num > span {
                font-size: 17px;
                top: 18px;
            }
            .mark-line::before {
                height: 12px;
                width: 2px;
                top: 14px;
            }
            .mark-line.hour::before {
                height: 18px;
                width: 3px;
                top: 10px;
            }
            .center-dot {
                width: 14px;
                height: 14px;
            }
            .digital-time span {
                font-size: 1.8rem;
            }
            .digital-time .seconds {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 380px) {
            .clock-face {
                width: 200px;
                height: 200px;
            }
            .clock-wrapper {
                padding: 1rem 1rem 1.5rem;
                border-radius: 2.5rem 2.5rem 3rem 3rem;
            }
            .hand-hour {
                height: 48px;
                width: 5px;
                margin-left: -2.5px;
            }
            .hand-minute {
                height: 68px;
                width: 3.5px;
                margin-left: -1.75px;
            }
            .hand-second {
                height: 72px;
                width: 1.8px;
                margin-left: -0.9px;
            }
            .num > span {
                font-size: 13px;
                top: 12px;
            }
            .mark-line::before {
                height: 9px;
                width: 2px;
                top: 10px;
            }
            .mark-line.hour::before {
                height: 14px;
                width: 2.5px;
                top: 7px;
            }
            .center-dot {
                width: 12px;
                height: 12px;
            }
            .digital-time span {
                font-size: 1.4rem;
            }
            .digital-time .seconds {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="clock-wrapper">
    <div class="clock-face" id="clockFace">
        <!-- 刻度 & 数字 使用JS生成，避免写死 -->
        <div id="marksContainer"></div>

        <!-- 指针层 -->
        <div class="hands">
            <div class="hand hand-hour" id="hourHand"></div>
            <div class="hand hand-minute" id="minuteHand"></div>
            <div class="hand hand-second" id="secondHand"></div>
        </div>
        <!-- 中心装饰 -->
        <div class="center-dot"></div>
    </div>

    <!-- 数字时间显示 -->
    <div class="digital-time" id="digitalTime">
        <span id="hoursDisplay">00</span>
        <span>:</span>
        <span id="minutesDisplay">00</span>
        <span>:</span>
        <span class="seconds" id="secondsDisplay">00</span>
        <span class="date" id="dateDisplay">----年--月--日</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // --- DOM 引用 ---
        const hourHand = document.getElementById('hourHand');
        const minuteHand = document.getElementById('minuteHand');
        const secondHand = document.getElementById('secondHand');
        const hoursSpan = document.getElementById('hoursDisplay');
        const minutesSpan = document.getElementById('minutesDisplay');
        const secondsSpan = document.getElementById('secondsDisplay');
        const dateSpan = document.getElementById('dateDisplay');
        const marksContainer = document.getElementById('marksContainer');

        // --- 生成表盘刻度 & 数字 (一次) ---
        function buildClockMarks() {
            const fragment = document.createDocumentFragment();
            const totalMarks = 60;   // 60个刻度 (12个整点 + 48个分钟)
            const faceSize = 320;     // 用于计算定位，但使用百分比更灵活

            for (let i = 0; i < totalMarks; i++) {
                const angle = i * 6;  // 6度一格
                const isHour = (i % 5 === 0);
                const markDiv = document.createElement('div');
                markDiv.className = 'mark-line' + (isHour ? ' hour' : '');
                markDiv.style.transform = `rotate(${angle}deg)`;
                fragment.appendChild(markDiv);
            }

            // 添加数字 (1-12)
            for (let i = 1; i <= 12; i++) {
                const angle = i * 30;  // 30度一格
                const numDiv = document.createElement('div');
                numDiv.className = 'num';
                numDiv.style.transform = `rotate(${angle}deg)`;
                const span = document.createElement('span');
                span.textContent = i;
                numDiv.appendChild(span);
                fragment.appendChild(numDiv);
            }

            marksContainer.appendChild(fragment);
        }
        buildClockMarks();

        // --- 更新时间函数 (指针+数字) ---
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // 计算精确角度 (平滑秒针)
            // 秒针: 每秒 6度, 加上毫秒微调
            const secDeg = (seconds * 6) + (milliseconds / 1000) * 6;
            // 分针: 每分钟 6度, 加上秒数偏移 (0.1度/秒)
            const minDeg = (minutes * 6) + (seconds * 0.1);
            // 时针: 每小时 30度 + 分钟偏移 (0.5度/分)
            const hourDeg = ((hours % 12) * 30) + (minutes * 0.5);

            // 应用旋转 (指针默认指向12点方向)
            secondHand.style.transform = `rotate(${secDeg}deg)`;
            minuteHand.style.transform = `rotate(${minDeg}deg)`;
            hourHand.style.transform = `rotate(${hourDeg}deg)`;

            // --- 更新数字时间 ---
            const hh = String(hours).padStart(2, '0');
            const mm = String(minutes).padStart(2, '0');
            const ss = String(seconds).padStart(2, '0');
            hoursSpan.textContent = hh;
            minutesSpan.textContent = mm;
            secondsSpan.textContent = ss;

            // 日期 (年-月-日 星期)
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];
            dateSpan.textContent = `${year}年${month}月${day}日 · ${weekday}`;
        }

        // --- 启动时钟: 先立即执行一次, 再每秒更新 ---
        updateClock();

        // 使用 setInterval 每秒刷新 (保证秒针连续)
        const intervalId = setInterval(updateClock, 200); // 200ms 更新让秒针更平滑

        // 可选: 在页面可见性变化时依然保持准确 (不做额外操作, setInterval继续)
        // 但为了性能, 当页面隐藏时可考虑停止, 但这里不处理, 保持简单

        // 页面卸载时清除定时器 (良好习惯)
        window.addEventListener('beforeunload', function() {
            clearInterval(intervalId);
        });

        // 额外: 针对移动端或者resize, 无需额外操作

        // 如果有需要, 可以点击时钟微调? 不实现
        console.log('🕒 模拟时钟已启动');
    })();
</script>
</body>
</html>
